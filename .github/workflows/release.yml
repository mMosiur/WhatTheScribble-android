name: Create Production Release

on:
  push:
    tags:
      - 'v*' # Triggers on v1.0.0, v2.1.0, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version override (e.g., 1.2.3). If empty, uses tag or gradle version.'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Generate Production Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetches all tags and history for automated release notes

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Decode Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p build
          echo "$KEYSTORE_BASE64" | base64 --decode > build/release.jks

      - name: Build Production Release Artifacts
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Get Version Name
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VERSION="${{ github.ref_name }}"
          else
            RAW_VERSION=$(grep "versionName =" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          fi
          # Strip leading 'v' to ensure consistency (we add it back in the filename)
          CLEAN_VERSION=$(echo $RAW_VERSION | sed 's/^v//')
          echo "VERSION_NAME=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Rename Release Files for Clarity
        run: |
          VERSION_NAME=${{ steps.get_version.outputs.VERSION_NAME }}
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/WhatTheScribble-v$VERSION_NAME.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/WhatTheScribble-v$VERSION_NAME.aab

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/WhatTheScribble-v${{ steps.get_version.outputs.VERSION_NAME }}.apk
            app/build/outputs/bundle/release/WhatTheScribble-v${{ steps.get_version.outputs.VERSION_NAME }}.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
